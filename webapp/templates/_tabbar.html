{# Bottom tab bar (phone). Set `active` to "map" or "profile" before including. My parking is not built yet. #}
{% set on = "text-teal font-semibold" %}
{% set off = "text-stone" %}
<nav class="tabbar fixed inset-x-0 bottom-0 z-[1000] h-16 bg-white border-t border-stone-line grid grid-cols-3 text-sm" aria-label="Main">
  <a href="/" class="flex flex-col items-center justify-center gap-0.5 {{ on if active == 'map' else off }}" {% if active == 'map' %}aria-current="page"{% endif %}>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
    Map
  </a>
  <span class="flex flex-col items-center justify-center gap-0.5 text-stone opacity-40" aria-disabled="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h5l3 8M10 8l2 8h-6M9 5h3"/></svg>
    My parking
  </span>
  <a href="/profile" class="flex flex-col items-center justify-center gap-0.5 {{ on if active == 'profile' else off }}" {% if active == 'profile' %}aria-current="page"{% endif %}>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
    Profile
  </a>
</nav>
